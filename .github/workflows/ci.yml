name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  unix-only-build-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          install-mold: 'true'
          expect-cache: any
      - name: Verify non-Unix builds are rejected
        run: |
          rustup target add x86_64-pc-windows-gnu
          if cargo check --target x86_64-pc-windows-gnu > /tmp/dbar-non-unix-check.log 2>&1; then
            echo "dbar unexpectedly compiled for a non-Unix target" >&2
            exit 1
          fi
          grep --fixed-strings --quiet "dbar supports Unix targets only" /tmp/dbar-non-unix-check.log

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          install-mold: 'true'
          expect-cache: any
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          # The dev profile builds with the Cranelift backend, so the lint suite's
          # toolchain needs rustc-codegen-cranelift too.
          cranelift: 'true'
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is a
          # measurement, so it takes neither the parallel frontend nor the mold linker.
          # Assigning RUSTFLAGS displaces every `rustflags` table in .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          output-path: lcov.info
          format: lcov
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
